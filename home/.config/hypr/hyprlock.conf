source = ~/.config/theme/hyprlock.conf
source = ~/.config/hypr/hyprlock-wallpaper.conf

auth {
    fingerprint {
        enabled = true
        ready_message = Fingerprint or password
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    monitor =
    path = $wallpaper
    color = $color

    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.17
    vibrancy_darkness = 0.15
    noise = 0.0117
}

# The game's colour logic: coral frame at rest, accent while checking, alert on
# failure; the typed dots are data, so accent. hyprlock can't cut corners, so
# the card is reduced to its frame and fill.
input-field {
    monitor =
    size = 300, 48
    rounding = 0
    outline_thickness = 1
    font_family = Rajdhani SemiBold
    dots_center = true
    dots_rounding = 0
    outer_color = $structure_color
    inner_color = $card_color
    font_color = $accent_color
    check_color = $check_color
    fail_color = $fail_color
    fade_on_empty = false
    placeholder_text = <span foreground="##$structure_hex">$FPRINTPROMPT</span>
    fail_text = <span foreground="##$alert_hex">$FAIL</span>
    position = 0, -40
    halign = center
    valign = center
}

# Date as a label, time as data - the bar's clock, large
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B" | tr '[:lower:]' '[:upper:]'
    color = $structure_color
    font_size = 16
    font_family = Rajdhani SemiBold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $accent_color
    font_size = 60
    font_family = Rajdhani SemiBold
    position = 0, 80
    halign = center
    valign = center
}

# --- The game's full-screen frame -------------------------------------------
# Thin vertical lines near both edges and dim device micro-text in the
# corners, as on the game's full-screen menus (STYLEGUIDE.md section 7). All
# dim: decoration, never information you need.

shape {
    monitor =
    size = 1, 700
    color = $line_color
    rounding = 0
    border_size = 0
    position = 28, 0
    halign = left
    valign = center
}

shape {
    monitor =
    size = 1, 700
    color = $line_color
    rounding = 0
    border_size = 0
    position = -28, 0
    halign = right
    valign = center
}

label {
    monitor =
    text = ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO<br/>MANIPULATE, ACCESS OR DISABLE THIS DEVICE.
    color = $micro_color
    font_size = 8
    font_family = Rajdhani SemiBold
    position = 44, -36
    halign = left
    valign = top
}

# Real system data dressed as the device's firmware block
label {
    monitor =
    text = cmd[update:0] printf 'IMAGE NAME: %s<br/>IMAGE TYPE: ARM LINUX KERNEL IMAGE<br/>HOST: %s' "$(uname -r | tr a-z A-Z)" "$(cat /etc/hostname | tr a-z A-Z)"
    color = $micro_color
    font_size = 8
    font_family = Rajdhani SemiBold
    position = 44, 36
    halign = left
    valign = bottom
}

label {
    monitor =
    text = MODEL LINE 12.12AA
    color = $micro_color
    font_size = 8
    font_family = Rajdhani SemiBold
    position = -44, 36
    halign = right
    valign = bottom
}

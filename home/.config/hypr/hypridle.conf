# Idle: lock at 5 min, screen off 30 s later - but only if still locked.
#
# Typing the password into hyprlock doesn't count as activity for the idle
# timers, so the screen-off timer kept running while you unlocked and fired
# a few seconds afterwards. Checking for hyprlock skips it once unlocked;
# the keypress that wakes the screen is handled by Hyprland itself
# (misc:key_press_enables_dpms / mouse_move_enables_dpms in lua/misc.lua).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = pidof hyprlock >/dev/null && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Generated by matugen from ~/.config/matugen/templates/satty.toml - do not edit.
# Visual settings only; behaviour comes from satty's defaults and the flags in
# the Print bind. The window itself is GTK4 and follows gtk-4.0/gtk.css.
[general]
# Square rectangles, like the theme's cards
corner-roundness = 0

[font]
family = "Rajdhani"
style = "SemiBold"

[color-palette]
# Toolbar swatches, first is the default: coral, cyan, amber, green, magenta, white
palette = [
    "{{theme.structure}}ff",
    "{{theme.accent}}ff",
    "{{theme.yellow}}ff",
    "{{theme.green}}ff",
    "{{theme.magenta}}ff",
    "{{theme.fg}}ff",
]

# Generated by matugen from ~/.config/matugen/templates/hyprtoolkit.conf - do not edit.
# Theme for hyprtoolkit apps (hyprpolkitagent's authentication dialog): the
# game's card - dark fill, square corners, Rajdhani; accent for focus and
# primary actions, coral as the secondary accent.
background = rgba({{theme.bg | replace: "#", ""}}ff)
base = rgba({{theme.surface | replace: "#", ""}}ff)
alternate_base = rgba({{theme.surface_hi | replace: "#", ""}}ff)
text = rgba({{theme.fg | replace: "#", ""}}ff)
bright_text = rgba({{theme.bright_white | replace: "#", ""}}ff)
accent = rgba({{theme.accent | replace: "#", ""}}ff)
accent_secondary = rgba({{theme.structure | replace: "#", ""}}ff)

font_family = Rajdhani
font_family_monospace = JetBrainsMono Nerd Font

rounding_large = 0
rounding_small = 0

# Smaller headings so the dialog title fits instead of being elided
h1_size = 15
h2_size = 12
h3_size = 12

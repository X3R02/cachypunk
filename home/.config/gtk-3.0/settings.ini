[Settings]
# GTK3 doesn't read the org.gnome.desktop.interface color-scheme key that GTK4
# and the xdg portal use, so without this the toolkit falls back to the light
# Adwaita variant even though the rest of the desktop is dark.
gtk-application-prefer-dark-theme=1
# adw-gtk3-dark (package adw-gtk-theme) follows the libadwaita color names
# that matugen writes to gtk.css; stock Adwaita GTK3 hardcodes most colors.
gtk-theme-name=adw-gtk3-dark
gtk-font-name=IBM Plex Sans 11

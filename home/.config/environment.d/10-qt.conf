# Read by the systemd user session at login, which is what D-Bus-activated
# services inherit. Hyprland's own hl.env only reaches processes Hyprland
# spawns, so it misses things like xdg-desktop-portal-hyprland (and the Qt
# share picker it launches, which would otherwise render light).
QT_QPA_PLATFORMTHEME=qt6ct

# neovim is the only editor installed; tools fall back to vi/nano otherwise.
EDITOR=nvim
VISUAL=nvim
